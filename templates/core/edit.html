{% extends 'core/base.html' %}

{% block title %}Edit Task{% endblock %}

{% block content %}
    <h1 class="mb-3">Edit Task</h1>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
        </div>
        <div class="form-floating mb-3">
            <textarea class="form-control" id="description" name="description" placeholder="Description" style="height: 120px">{{ task.description|default_if_none:'' }}</textarea>
            <label for="description">Description</label>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'todolist' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
